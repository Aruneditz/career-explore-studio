
[project]
name = "career-explore-studio-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
]

[tool.vercel]
entrypoint = "app.main:app"
